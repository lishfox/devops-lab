# Задача 02. Где работает ${{ }}, а где $VAR
# Условие: tasks/02-expressions.md
# Менять можно только job "task". Job "check" (🔒) не трогай.
name: "task-02: expressions"

on:
  push:
    paths: [.github/workflows/task-02.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task:
    runs-on: ubuntu-latest
    outputs:
      from_run: ${{ steps.shell.outputs.sha }}
      from_action: ${{ steps.action.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: SHA from shell
        id: shell
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: SHA through an action
        id: action
        uses: ./.github/actions/echo-value
        with:
          value: ${GITHUB_SHA}

  # 🔒 Проверка. Не менять.
  check:
    needs: task
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          WANT: ${{ github.sha }}
          FROM_RUN: ${{ needs.task.outputs.from_run }}
          FROM_ACTION: ${{ needs.task.outputs.from_action }}
        run: |
          echo "want=$WANT"
          echo "from_run=$FROM_RUN"
          echo "from_action=$FROM_ACTION"
          ok=1
          [ "$FROM_RUN" = "$WANT" ] || { echo "::error::Шаг 'SHA from shell' вернул не тот SHA"; ok=0; }
          [ "$FROM_ACTION" = "$WANT" ] || { echo "::error::Шаг 'SHA through an action' вернул '$FROM_ACTION' вместо SHA"; ok=0; }
          [ "$ok" = 1 ] && echo "✅ Оба шага вернули SHA"
          [ "$ok" = 1 ]
