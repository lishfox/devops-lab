name: Echo value
description: Prints the input and returns it as an output.
inputs:
  value:
    description: Any string
    required: true
outputs:
  value:
    description: The same string
    value: ${{ steps.echo.outputs.value }}
runs:
  using: composite
  steps:
    - id: echo
      shell: bash
      env:
        VALUE: ${{ inputs.value }}
      run: |
        echo "Action received: $VALUE"
        echo "value=$VALUE" >> "$GITHUB_OUTPUT"
